<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Retro Snake</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #111;
                color: #fff;
                font-family: monospace;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                overflow: hidden;
            }
            #score-board {
                font-size: 16px;
                margin-bottom: 5px;
            }
            canvas {
                border: 2px solid #555;
                background-color: #000;
            }
            #game-over-screen {
                display: none;
                position: absolute;
                text-align: center;
                background: rgba(0, 0, 0, 0.8);
                padding: 20px;
                border-radius: 5px;
            }
        </style>
    </head>
    <body>
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <!-- 220x260 canvas leaves room for the score board on a 240x320 screen -->
        <canvas id="gameCanvas" width="220" height="260"></canvas>

        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p>Press OK / Enter<br />to Restart</p>
        </div>

        <script>
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");
            const scoreElement = document.getElementById("score");
            const gameOverScreen = document.getElementById("game-over-screen");

            const gridSize = 10;
            let snake = [
                { x: 100, y: 130 },
                { x: 90, y: 130 },
                { x: 80, y: 130 },
            ];
            let dx = gridSize;
            let dy = 0;
            let foodX, foodY;
            let score = 0;
            let gameInterval;
            let isGameOver = false;

            function startGame() {
                snake = [
                    { x: 100, y: 130 },
                    { x: 90, y: 130 },
                    { x: 80, y: 130 },
                ];
                dx = gridSize;
                dy = 0;
                score = 0;
                scoreElement.innerText = score;
                isGameOver = false;
                gameOverScreen.style.display = "none";
                generateFood();
                clearInterval(gameInterval);
                gameInterval = setInterval(main, 150); // Speed: lower number = faster game
            }

            function main() {
                if (hasGameEnded()) {
                    isGameOver = true;
                    gameOverScreen.style.display = "block";
                    clearInterval(gameInterval);
                    return;
                }

                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
            }

            function clearCanvas() {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            function drawSnake() {
                ctx.fillStyle = "#00FF00"; // Retro Green
                snake.forEach((part) =>
                    ctx.fillRect(part.x, part.y, gridSize - 1, gridSize - 1),
                );
            }

            function moveSnake() {
                const head = { x: snake[0].x + dx, y: snake[0].y + dy };
                snake.unshift(head);

                if (snake[0].x === foodX && snake[0].y === foodY) {
                    score += 10;
                    scoreElement.innerText = score;
                    generateFood();
                } else {
                    snake.pop();
                }
            }

            function generateFood() {
                foodX =
                    Math.floor(Math.random() * (canvas.width / gridSize)) *
                    gridSize;
                foodY =
                    Math.floor(Math.random() * (canvas.height / gridSize)) *
                    gridSize;
                // Ensure food doesn't spawn on top of the snake
                snake.forEach((part) => {
                    if (part.x === foodX && part.y === foodY) generateFood();
                });
            }

            function drawFood() {
                ctx.fillStyle = "#FF0000"; // Red Food
                ctx.fillRect(foodX, foodY, gridSize - 1, gridSize - 1);
            }

            function hasGameEnded() {
                // Wall collisions
                if (
                    snake[0].x < 0 ||
                    snake[0].x >= canvas.width ||
                    snake[0].y < 0 ||
                    snake[0].y >= canvas.height
                )
                    return true;
                // Self collisions
                for (let i = 4; i < snake.length; i++) {
                    if (snake[i].x === snake[0].x && snake[i].y === snake[0].y)
                        return true;
                }
                return false;
            }

            // Feature Phone Keypad Mapping
            window.addEventListener("keydown", function (e) {
                if (isGameOver) {
                    // Return / Enter / OK key on Nokia restarts game
                    if (e.key === "Enter" || e.keyCode === 13) startGame();
                    return;
                }

                // Maps physical hardware D-Pad and number keys (2, 4, 6, 8)
                const keyPressed = e.key;
                const keyCode = e.keyCode;

                const goingUp = dy === -gridSize;
                const goingDown = dy === gridSize;
                const goingRight = dx === gridSize;
                const goingLeft = dx === -gridSize;

                if (
                    (keyPressed === "ArrowLeft" || keyCode === 52) &&
                    !goingRight
                ) {
                    // Left or '4'
                    dx = -gridSize;
                    dy = 0;
                }
                if (
                    (keyPressed === "ArrowUp" || keyCode === 50) &&
                    !goingDown
                ) {
                    // Up or '2'
                    dx = 0;
                    dy = -gridSize;
                }
                if (
                    (keyPressed === "ArrowRight" || keyCode === 54) &&
                    !goingLeft
                ) {
                    // Right or '6'
                    dx = gridSize;
                    dy = 0;
                }
                if (
                    (keyPressed === "ArrowDown" || keyCode === 56) &&
                    !goingUp
                ) {
                    // Down or '8'
                    dx = 0;
                    dy = gridSize;
                }
            });

            startGame();
        </script>
    </body>
    <!--Test-->
</html>
